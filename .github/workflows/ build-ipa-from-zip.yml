name: Build unsigned IPA from Release

on:

  workflow_dispatch:
  
permissions:

  contents: read
  
env:

  ORIGINAL_ZIP_URL: https://github.com/Arthur1010885/scriptyyy/releases/download/source-v1/original.zip
  
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  
jobs:

  build:
  
    runs-on: macos-15
    
    steps:
    
      - name: Download and extract original.zip
      
        shell: bash
        
        run: |
        
          set -Eeuo pipefail
          
          zip="$RUNNER_TEMP/original.zip"
          
          curl -fL --retry 3 -o "$zip" "$ORIGINAL_ZIP_URL"
          
          test -s "$zip"
          
          unzip -tq "$zip"
          
          mkdir -p "$RUNNER_TEMP/source"
          
          unzip -q "$zip" -d "$RUNNER_TEMP/source"
          
          while [ "$(find "$RUNNER_TEMP/source" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = 1 ] && [ "$(find "$RUNNER_TEMP/source" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = 0 ]; do
          
            dir=$(find "$RUNNER_TEMP/source" -mindepth 1 -maxdepth 1 -type d | head -n 1)
            
            shopt -s dotglob; mv "$dir"/* "$RUNNER_TEMP/source/" 2>/dev/null || true; shopt -u dotglob
            
            rmdir "$dir" 2>/dev/null || true
            
          done
          
      - name: Locate project and scheme
      
        id: settings
        
        shell: bash
        
        run: |
        
          set -Eeuo pipefail
          
          source="$RUNNER_TEMP/source"
          
          workspace=$(find "$source" -name '*.xcworkspace' -print | head -n 1 || true)
          
          project=$(find "$source" -name '*.xcodeproj' -print | head -n 1 || true)
          
          if [ -n "$workspace" ]; then kind=workspace; path="$workspace"; else kind=project; path="$project"; fi
          
          [ -n "$path" ] || { echo 'No Xcode project found in original.zip.'; exit 1; }
          
          if [ "$kind" = workspace ]; then container=(-workspace "$path"); else container=(-project "$path"); fi
          
          scheme=$(xcodebuild "${container[@]}" -list 2>/dev/null | sed -n '/Schemes:/,$p' | tail -n +2 | sed 's/^[[:space:]]*//' | sed '/^$/d' | head -n 1)
          
          [ -n "$scheme" ] || { echo 'No Xcode scheme found.'; exit 1; }
          
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          
          echo "path=$path" >> "$GITHUB_OUTPUT"
          
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          
          echo "Using $kind: $path; scheme: $scheme"
          
      - name: Build unsigned archive
      
        shell: bash
        
        run: |
        
          set -Eeuo pipefail
          
          if [ "${{ steps.settings.outputs.kind }}" = workspace ]; then container=(-workspace "${{ steps.settings.outputs.path }}"); else container=(-project "${{ steps.settings.outputs.path }}"); fi
          
          xcodebuild "${container[@]}" -scheme "${{ steps.settings.outputs.scheme }}" -sdk iphoneos -configuration Release -archivePath "$RUNNER_TEMP/OriginalStore.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          
      - name: Package unsigned IPA
      
        shell: bash
        
        run: |
        
          set -Eeuo pipefail
          
          app=$(find "$RUNNER_TEMP/OriginalStore.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -print | head -n 1)
          
          test -n "$app"
          
          mkdir -p "$RUNNER_TEMP/Payload"; cp -R "$app" "$RUNNER_TEMP/Payload/"
          
          (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/OriginalStore-unsigned.ipa" Payload)
          
      - name: Upload IPA artifact
      
        uses: actions/upload-artifact@v4
        
        with:
        
          name: OriginalStore-unsigned-ipa
          
          path: OriginalStore-unsigned.ipa
          
          if-no-files-found: error
          
      - name: Upload build log
      
        if: always()
        
        uses: actions/upload-artifact@v4
        
        with:
        
          name: xcodebuild-log
          
          path: ${{ runner.temp }}/xcodebuild.log
          
          if-no-files-found: warn
          


































































